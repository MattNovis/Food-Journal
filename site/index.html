<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kin Khao</title>
<meta name="description" content="A photo journal of everything eaten in Thailand, 22 Nov – 8 Dec 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }

  /* Masthead */
  .masthead { position: relative; overflow: hidden; padding: var(--s-8) 0 var(--s-6); }
  .masthead .wrap { position: relative; }
  .masthead h1 { font-size: var(--step-5); letter-spacing: -0.02em; }
  .masthead h1 .thai { display: block; font: 500 var(--step-1)/1.3 "Sarabun", var(--font-body); color: var(--fern); letter-spacing: 0; margin-top: var(--s-2); }
  .tagline { font-size: var(--step-1); color: var(--ink-soft); margin: var(--s-4) 0 0; max-width: 32ch; }
  .ledger { margin: var(--s-5) 0 0; font-size: var(--step-0); color: var(--ink); max-width: 60ch; }
  .ledger strong { font-weight: 700; }
  .theme-btn {
    position: absolute; top: calc(-1 * var(--s-7)); right: 16px; width: 40px; height: 40px;
    display: grid; place-items: center; border-radius: var(--radius-sm); border: 1.5px solid var(--rule);
    background: var(--paper-raised); color: var(--ink); cursor: pointer;
  }
  @media (min-width: 720px) { .theme-btn { right: 32px; } }
  .theme-btn svg { width: 20px; height: 20px; }

  /* Controls */
  .controls { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
  .controls .wrap { display: flex; gap: var(--s-3); align-items: center; padding-top: var(--s-3); padding-bottom: var(--s-3); }
  .filters { display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; flex: 1; padding: 2px; margin: -2px; }
  .filters::-webkit-scrollbar { display: none; }
  .chip .n { color: inherit; opacity: .6; font-weight: 500; }
  .sort { display: flex; border: 1.5px solid var(--rule); border-radius: var(--pill); padding: 2px; flex: none; background: var(--paper-raised); }
  .sort button { appearance: none; border: 0; background: none; color: var(--ink-soft); font: 600 var(--step--1)/1 var(--font-body); padding: .55em .9em; border-radius: var(--pill); cursor: pointer; }
  .sort button[aria-pressed="true"] { background: var(--fern); color: var(--paper-raised); }

  /* Best bites */
  .best { padding: var(--s-7) 0 var(--s-4); }
  .section-title { font-size: var(--step-3); margin-bottom: var(--s-5); }
  .best-row { display: grid; gap: var(--s-5); grid-template-columns: 1fr; }
  @media (min-width: 760px) { .best-row { grid-template-columns: 1.4fr 1fr 1fr; } }

  /* Days */
  main { padding-bottom: var(--s-8); }
  .day { padding: var(--s-7) 0 0; }
  .day-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s-2) var(--s-4); margin-bottom: var(--s-5); padding-bottom: var(--s-3); border-bottom: 1px solid var(--rule); }
  .day-head h2 { font-size: var(--step-3); }
  .day-num { font-weight: 700; font-size: var(--step--1); color: var(--r); letter-spacing: .04em; }
  .day-meta { margin-left: auto; color: var(--ink-faint); font-size: var(--step--1); font-weight: 600; }
  .day-empty { color: var(--ink-soft); margin: 0; padding: var(--s-4) var(--s-5); background: var(--paper-sunk); border-radius: var(--radius-md); max-width: 70ch; }
  .day-empty em { font-style: normal; color: var(--ink); font-weight: 600; }

  .grid { display: grid; gap: var(--s-6) var(--s-5); grid-template-columns: 1fr; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 940px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  /* Still to come */
  .ahead { padding-top: var(--s-7); }
  .ahead-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--rule); }
  .ahead-list li { display: grid; grid-template-columns: 7.5rem 1fr; gap: var(--s-1) var(--s-4); padding: var(--s-3) 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .ahead-list .d { font-weight: 600; }
  .ahead-list .hint { grid-column: 2; color: var(--ink-soft); font-size: var(--step--1); }
  @media (max-width: 520px) { .ahead-list li { grid-template-columns: 1fr; } .ahead-list .hint { grid-column: 1; } }

  /* Dish card */
  .dish { display: flex; flex-direction: column; gap: var(--s-3); cursor: pointer; color: inherit; text-align: left; background: none; border: 0; padding: 0; font: inherit; }
  .dish figure { margin: 0; position: relative; border-radius: var(--radius-lg); overflow: hidden; aspect-ratio: 4 / 5; background: var(--paper-sunk); box-shadow: var(--shadow-1); transition: box-shadow .4s var(--ease-out), transform .4s var(--ease-out); }
  .dish:hover figure { box-shadow: var(--shadow-2); transform: translateY(-3px); }
  .dish img { width: 100%; height: 100%; object-fit: cover; }
  .dish figure.nophoto, .best-row .dish:first-child figure.nophoto { aspect-ratio: auto; height: 88px; }
  .dish figure.nophoto .noimg svg { width: 40px; }
  .dish .noimg { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--r) 18%, var(--paper-sunk)); color: var(--r); }
  .dish .noimg svg { width: 45%; opacity: .7; }
  .dish .badge {
    position: absolute; left: var(--s-3); bottom: var(--s-3); background: var(--paper-raised); color: var(--ink);
    padding: .45em .75em .4em; border-radius: var(--radius-sm); box-shadow: var(--shadow-1); font-size: .9rem;
  }
  .dish .badge.top { background: var(--hibiscus); color: var(--on-accent); }
  .dish .badge.top span { color: inherit; opacity: .75; }
  .dish h3 { font-size: var(--step-2); }
  .dish .thai { font-family: "Sarabun", var(--font-body); color: var(--ink-soft); margin: -.4em 0 0; }
  .dish .where { margin: 0; display: flex; flex-wrap: wrap; gap: .25em .75em; align-items: center; font-size: var(--step--1); color: var(--ink-soft); }
  .dish .where .place { font-weight: 600; color: var(--ink); }
  .dish .desc { margin: 0; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .dish .sides { margin: 0; font-size: var(--step--1); color: var(--ink-soft); }
  .dish .sides b { color: var(--ink); font-weight: 700; }
  .dish .foot { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); font-size: var(--step--1); color: var(--ink-faint); }
  .best-row .dish:first-child figure { aspect-ratio: 5 / 4; }
  @media (max-width: 759px) { .best-row .dish:first-child figure { aspect-ratio: 4 / 5; } }

  /* Empty journal */
  .welcome { margin: var(--s-7) 0 0; padding: var(--s-6); border: 2px dashed var(--rule); border-radius: var(--radius-lg); max-width: 62ch; }
  .welcome h2 { font-size: var(--step-2); margin-bottom: var(--s-2); }
  .welcome p { margin: 0; color: var(--ink-soft); }

  /* Lightbox */
  dialog { border: 0; padding: 0; background: var(--paper-raised); color: var(--ink); border-radius: var(--radius-lg); max-width: min(980px, calc(100vw - 32px)); width: 100%; max-height: calc(100dvh - 32px); box-shadow: var(--shadow-2); }
  dialog::backdrop { background: rgb(8 20 13 / .72); backdrop-filter: blur(3px); }
  dialog[open] { animation: rise .45s var(--ease-out); }
  @keyframes rise { from { transform: translateY(16px) scale(.98); opacity: 0; } }
  .lb { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 820px) { .lb { grid-template-columns: 1.3fr 1fr; } .lb.nophoto { grid-template-columns: 1fr; max-width: 560px; } }
  dialog:has(.lb.nophoto) { max-width: min(560px, calc(100vw - 32px)); }
  .lb.nophoto .lb-body { padding-top: var(--s-7); }
  .lb-photo { background: #0b1a12; display: grid; place-items: center; min-height: 240px; }
  .lb-photo img { max-height: 78dvh; width: 100%; object-fit: contain; }
  .lb-body { padding: var(--s-6); display: flex; flex-direction: column; gap: var(--s-4); overflow: auto; }
  .lb-body h2 { font-size: var(--step-4); }
  .lb-body .thai { font-family: "Sarabun", var(--font-body); color: var(--ink-soft); font-size: var(--step-1); margin: -.3em 0 0; }
  .lb-body .desc { margin: 0; white-space: pre-line; max-width: 60ch; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: var(--s-2) var(--s-4); margin: 0; font-size: var(--step--1); }
  .facts dt { color: var(--ink-faint); font-weight: 600; }
  .facts dd { margin: 0; }
  .breakdown { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
  .breakdown th, .breakdown td { padding: .4em .5em; text-align: right; border-bottom: 1px solid var(--rule); }
  .breakdown th:first-child, .breakdown td:first-child { text-align: left; padding-left: 0; }
  .breakdown thead th { color: var(--ink-faint); font-weight: 600; }
  .breakdown tbody th { font-weight: 600; }
  .breakdown td.total { font-weight: 700; color: var(--ink); }
  .breakdown .short { display: none; }
  .side-list { list-style: none; margin: var(--s-2) 0 0; padding: 0; }
  .side-list li { display: flex; justify-content: space-between; gap: var(--s-3); padding: .3em 0; border-top: 1px solid var(--rule); }
  .side-list small { color: var(--ink-faint); }
  .side-list b { font-weight: 700; }
  @media (max-width: 599px) { .breakdown .full { display: none; } .breakdown .short { display: inline; } .breakdown th, .breakdown td { padding: .4em .3em; } }
  .lb-close { position: absolute; top: var(--s-3); right: var(--s-3); width: 40px; height: 40px; border-radius: var(--pill); border: 0; background: var(--paper-raised); color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow-1); z-index: 1; }
  .lb-close svg { width: 18px; height: 18px; }
  .lb-thumbs { display: flex; gap: var(--s-2); }
  .lb-thumbs button { width: 56px; height: 56px; padding: 0; border: 2px solid transparent; border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; background: none; }
  .lb-thumbs button[aria-current="true"] { border-color: var(--hibiscus); }
  .lb-thumbs img { width: 100%; height: 100%; object-fit: cover; }

  .todo { align-self: flex-start; font-size: var(--step--1); font-weight: 600; color: var(--hibiscus); }
  .score-btn, .wiz-nav button { appearance: none; font: 600 var(--step--1)/1 var(--font-body); padding: .8em 1.2em; border-radius: var(--pill); cursor: pointer; }
  .score-btn, .wiz-nav .primary { border: 0; background: var(--fern); color: var(--paper-raised); align-self: flex-start; }
  .wiz-nav .primary:disabled { opacity: .45; cursor: not-allowed; }
  .wiz-nav { display: flex; gap: var(--s-2); justify-content: space-between; margin-top: auto; padding-top: var(--s-2); }
  .wiz-nav .ghost { border: 1.5px solid var(--rule); background: none; color: var(--ink); }
  .wiz-step { margin: 0; font-size: var(--step--1); font-weight: 600; color: var(--ink-faint); }
  .wiz-q { margin: 0; color: var(--ink-soft); }
  .wiz-anchor { margin: 0; font-size: var(--step--1); color: var(--ink-faint); }
  .wiz-msg { margin: 0; font-size: var(--step--1); color: var(--ink-soft); min-height: 1.2em; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s-2); }
  @media (min-width: 820px) { .nums { grid-template-columns: repeat(10, 1fr); } }
  .nums button { appearance: none; min-height: 48px; border: 1.5px solid var(--rule); border-radius: var(--radius-sm); background: var(--paper); color: var(--ink); font: 600 var(--step-1)/1 var(--font-body); cursor: pointer; }
  .nums button:hover { border-color: var(--fern); }
  .nums button[aria-checked="true"] { background: var(--fern); border-color: var(--fern); color: var(--paper-raised); }
  @media (max-width: 819px) { .lb.scoring .lb-photo { min-height: 0; height: 120px; } .lb.scoring .lb-photo img { height: 120px; object-fit: cover; } }
  .multi { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s-4); }
  .multi li { display: grid; gap: var(--s-2); }
  .multi li > span { font-weight: 600; }
  .multi .nums { grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .multi .nums button { min-height: 36px; font-size: var(--step--1); }
  footer { border-top: 1px solid var(--rule); padding: var(--s-6) 0 var(--s-7); color: var(--ink-faint); font-size: var(--step--1); }

  @media (max-width: 599px) {
    .controls .wrap { flex-wrap: wrap; }
    .filters { flex-basis: 100%; }
    .dish figure, .best-row .dish:first-child figure { aspect-ratio: 1 / 1; }
  }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch colour theme"></button>
    <h1>Kin Khao<span class="thai" lang="th">กินข้าว · have you eaten yet?</span></h1>
    <p class="tagline" id="tagline"></p>
    <p class="ledger" id="ledger"></p>
  </div>
</header>

<div class="controls" id="controls">
  <div class="wrap">
    <div class="filters" id="filters" role="group" aria-label="Filter by place"></div>
    <div class="sort" role="group" aria-label="Order">
      <button type="button" data-sort="day" aria-pressed="true">By day</button>
      <button type="button" data-sort="best" aria-pressed="false">Best first</button>
    </div>
  </div>
</div>

<main class="wrap" id="main"></main>

<footer><div class="wrap" id="footer"></div></footer>

<dialog id="lightbox" aria-labelledby="lbTitle"></dialog>

<script src="data.js"></script>
<script>
(() => {
  const J = window.JOURNAL || { trip: { days: [], regions: {} }, entries: [] };
  const { trip } = J;
  const BASE = J.entries || [];
  let entries = BASE;
  const RATE = trip.thbPerUsd || 33.5;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dayIndex = Object.fromEntries(trip.days.map((d, i) => [d.date, i]));
  const dayOf = date => trip.days[dayIndex[date]];
  const fmtDate = (iso, opts = { weekday: "short", day: "numeric", month: "short" }) =>
    new Date(iso + "T12:00:00").toLocaleDateString("en-GB", opts);
  const baht = n => "฿" + Math.round(n).toLocaleString("en-US");
  const usd = n => "$" + (n / RATE < 10 ? (n / RATE).toFixed(2) : Math.round(n / RATE).toLocaleString("en-US"));
  const todayBkk = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });

  /* ---------- Icons (authored, one stroke weight) ---------- */
  const ICON = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    bowl: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 30h48c0 13-10.7 22-24 22S8 43 8 30Z"/><path d="M24 52v4h16v-4"/><path d="M40 8 28 30M48 12 34 30"/><path d="M22 24c0-4 4-4 4-8M30 24c0-4 4-4 4-8" opacity=".7"/></svg>',
  };

  /* ---------- Theme ---------- */
  const root = document.documentElement;
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const saved = store.get("kk-theme");
  if (saved) root.dataset.theme = saved;
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const paintThemeBtn = () => { $("#themeBtn").innerHTML = isDark() ? ICON.sun : ICON.moon; $("#themeBtn").setAttribute("aria-label", isDark() ? "Switch to light theme" : "Switch to dark theme"); };
  $("#themeBtn").onclick = () => { root.dataset.theme = isDark() ? "light" : "dark"; store.set("kk-theme", root.dataset.theme); paintThemeBtn(); };
  paintThemeBtn();

  /* ---------- Derived data ---------- */
  const regionName = k => trip.regions[k] || k;
  let priced, rated, totalThb, avg, daysWithFood, topRating;
  function derive() {
    priced = entries.filter(e => typeof e.priceThb === "number");
    rated = entries.filter(e => typeof e.rating === "number");
    totalThb = priced.reduce((s, e) => s + e.priceThb, 0);
    avg = rated.length ? rated.reduce((s, e) => s + e.rating, 0) / rated.length : null;
    daysWithFood = new Set(entries.map(e => e.date)).size;
    topRating = rated.length ? Math.max(...rated.map(e => e.rating)) : null;
    $("#ledger").innerHTML = entries.length
      ? `<strong>${entries.length} ${entries.length === 1 ? "dish" : "dishes"}</strong> across ${daysWithFood} ${daysWithFood === 1 ? "day" : "days"}` +
        (priced.length ? ` · <strong>${baht(totalThb)}</strong> spent (about ${usd(totalThb)})` : "") +
        (avg !== null ? ` · averaging <strong>${avg.toFixed(1)}/10</strong>` : "")
      : "Nothing logged yet. The first bite lands soon.";
  }

  $("#tagline").textContent = `Everything we ate in ${trip.country || "Thailand"}, ${fmtDate(trip.start, { day: "numeric", month: "short" })} – ${fmtDate(trip.end, { day: "numeric", month: "short", year: "numeric" })}.`;

  /* Route order of regions (consecutive duplicates collapsed) */
  const routeRegions = [];
  trip.days.forEach(d => { if (!routeRegions.includes(d.region) && d.region !== "transit") routeRegions.push(d.region); });
  if (entries.some(e => e.region === "transit")) routeRegions.unshift("transit");
  const countBy = r => entries.filter(e => e.region === r).length;

  /* ---------- State ---------- */
  const state = { region: "all", sort: "day" };
  try { const h = new URLSearchParams(location.hash.slice(1)); if (h.get("r")) state.region = h.get("r"); if (h.get("s")) state.sort = h.get("s"); } catch {}

  function renderFilters() {
    const chip = (key, label, n, region) =>
      `<button type="button" class="chip" ${region ? `data-region="${region}"` : ""} data-filter="${key}" aria-pressed="${state.region === key}">${esc(label)}${n !== null ? ` <span class="n">${n}</span>` : ""}</button>`;
    $("#filters").innerHTML = chip("all", "All", entries.length || null) +
      routeRegions.map(r => chip(r, regionName(r), countBy(r) || null, r)).join("");
    document.querySelectorAll(".sort button").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort === state.sort));
  }

  /* ---------- Cards ---------- */
  const ratingHtml = r => `<span class="rating"><b>${Number.isInteger(r) ? r : r.toFixed(1)}</b><span>/10</span></span>`;
  const priceHtml = e => typeof e.priceThb === "number" ? `<span class="price">${baht(e.priceThb)}<small>${usd(e.priceThb)}</small></span>` : "";

  const fmtScore = r => Number.isInteger(r) ? String(r) : r.toFixed(1);
  const sideName = it => typeof it === "string" ? it : it.name;
  const sidesDetail = sd => {
    const its = (sd.items || []).filter(it => typeof it === "object" && (typeof it.rating === "number" || it.note));
    if (!its.length) return "";
    return `<ul class="side-list">${its.map(it => `<li><span>${esc(it.name)}${it.note ? ` <small>${esc(it.note)}</small>` : ""}</span>${typeof it.rating === "number" ? `<b>${fmtScore(it.rating)}</b>` : ""}</li>`).join("")}</ul>`;
  };
  const sidesLine = e => {
    const sd = e.sides; if (!sd) return "";
    const score = typeof sd.rating === "number" ? `<b>${fmtScore(sd.rating)}/10</b>` : "";
    const items = (sd.items || []).map(sideName).join(", ");
    return `<p class="sides">Sides ${score}${score && items ? " · " : ""}${esc(items)}</p>`;
  };

  const RUBRIC = J.rubric || { flavour: 3, value: 2, texture: 2, presentation: 1 };
  function breakdown(e) {
    const sc = e.scores; if (!sc || !sc.main) return "";
    const keys = Object.keys(RUBRIC);
    const cap = k => k[0].toUpperCase() + k.slice(1);
    const row = (label, qs, total) => qs ? `<tr><th scope="row">${label}</th>${keys.map(k => `<td>${fmtScore(qs[k])}</td>`).join("")}<td class="total">${fmtScore(total)}</td></tr>` : "";
    return `<table class="breakdown"><thead><tr><th></th>${keys.map(k => `<th scope="col" title="${cap(k)}, weight ×${RUBRIC[k]}"><span class="full">${cap(k)}</span><span class="short">${({ flavour: "Flavour", value: "Value", texture: "Texture", presentation: "Pres." })[k] || cap(k)}</span><br><span style="font-weight:400">×${RUBRIC[k]}</span></th>`).join("")}<th scope="col">Score</th></tr></thead>
      <tbody>${row("Main", sc.main, e.rating)}</tbody></table>`;
  }

  function card(e) {
    const p = (e.photos || [])[0];
    const isTop = typeof e.rating === "number" && e.rating === topRating && rated.length > 1;
    return `<button type="button" class="dish" data-region="${esc(e.region)}" data-id="${esc(e.id)}" aria-label="${esc(e.dish)}, details">
      <figure class="${p ? "" : "nophoto"}">
        ${p ? `<img src="${esc(p.src)}" alt="${esc(p.alt || e.dish)}" width="${p.w || 1200}" height="${p.h || 1500}" loading="lazy" decoding="async">`
            : `<div class="noimg">${ICON.bowl}</div>`}
        ${typeof e.rating === "number" ? `<span class="badge ${isTop ? "top" : ""}">${ratingHtml(e.rating)}</span>` : ""}
      </figure>
      <h3>${esc(e.dish)}</h3>
      ${e.thaiName ? `<p class="thai" lang="th">${esc(e.thaiName)}</p>` : ""}
      <p class="where">${e.place?.name ? `<span class="place">${esc(e.place.name)}</span>` : ""}<span class="region-tag" data-region="${esc(e.region)}">${esc(e.place?.area || regionName(e.region))}</span></p>
      ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ""}
      ${sidesLine(e)}
      ${canScore && !e.scores?.main ? `<span class="todo">Needs scores</span>` : ""}
      <div class="foot">${priceHtml(e)}<span>${esc(e.meal ? e.meal[0].toUpperCase() + e.meal.slice(1) : "")}${typeof e.ambiance === "number" ? ` · Ambiance ${fmtScore(e.ambiance)}/10` : ""}</span></div>
    </button>`;
  }

  /* ---------- Views ---------- */
  function render() {
    renderFilters();
    const list = entries.filter(e => state.region === "all" || e.region === state.region);
    let html = "";

    if (!entries.length) {
      html += `<section class="welcome"><h2>The table is set</h2><p>Dishes appear here day by day as they're logged: photo, what it was, where, what it cost and a score out of 10.</p></section>`;
    }

    if (state.sort === "best") {
      const sorted = [...list].sort((a, b) => (b.rating ?? -1) - (a.rating ?? -1) || a.date.localeCompare(b.date));
      html += `<section class="day" data-region="${state.region === "all" ? "" : esc(state.region)}"><div class="day-head"><h2>Best first</h2><span class="day-meta">${sorted.length} ${sorted.length === 1 ? "dish" : "dishes"}</span></div>` +
        (sorted.length ? `<div class="grid">${sorted.map(card).join("")}</div>` : `<p class="day-empty">Nothing from ${esc(regionName(state.region))} yet.</p>`) + `</section>`;
    } else {
      if (state.region === "all" && rated.length >= 3) {
        const best = [...rated].sort((a, b) => b.rating - a.rating || a.date.localeCompare(b.date)).slice(0, 3);
        html += `<section class="best"><h2 class="section-title">Best bites so far</h2><div class="best-row">${best.map(card).join("")}</div></section>`;
      }
      const ahead = [];
      trip.days.forEach((d, i) => {
        const items = list.filter(e => e.date === d.date);
        if (state.region !== "all" && !items.length) return;
        const future = d.date > todayBkk;
        if (!items.length && future) { ahead.push(d); return; }
        const spent = items.filter(e => typeof e.priceThb === "number").reduce((s, e) => s + e.priceThb, 0);
        html += `<section class="day" data-region="${esc(d.region)}" id="d-${d.date}">
          <div class="day-head"><span class="day-num">DAY ${i + 1}</span><h2>${fmtDate(d.date)}</h2><span class="region-tag" data-region="${esc(d.region)}">${esc(d.location)}</span>
          ${items.length ? `<span class="day-meta">${items.length} ${items.length === 1 ? "dish" : "dishes"}${spent ? " · " + baht(spent) : ""}</span>` : ""}</div>
          ${items.length ? `<div class="grid">${items.map(card).join("")}</div>`
            : `<p class="day-empty">Nothing logged for this day${d.foodHint ? `. On the plan: <em>${esc(d.foodHint)}</em>` : "."}</p>`}
        </section>`;
      });
      if (ahead.length) {
        html += `<section class="ahead"><h2 class="section-title">Still to come</h2><ol class="ahead-list">` +
          ahead.map(d => `<li data-region="${esc(d.region)}"><span class="d">${fmtDate(d.date)}</span><span class="region-tag" data-region="${esc(d.region)}">${esc(d.location)}</span>${d.foodHint ? `<span class="hint">${esc(d.foodHint)}</span>` : ""}</li>`).join("") +
          `</ol></section>`;
      }
    }
    $("#main").innerHTML = html;
  }

  /* ---------- Lightbox ---------- */
  const dlg = $("#lightbox");
  function open(id) {
    const e = entries.find(x => x.id === id); if (!e) return;
    const photos = e.photos || [];
    const day = dayOf(e.date);
    const facts = [
      ["When", `${fmtDate(e.date, { weekday: "long", day: "numeric", month: "long" })}${e.meal ? ", " + e.meal : ""}${e.time ? " · " + e.time : ""}`],
      ["Where", [e.place?.name, e.place?.area || regionName(e.region)].filter(Boolean).map(esc).join(", ") + (e.place?.mapsUrl ? ` · <a href="${esc(e.place.mapsUrl)}" target="_blank" rel="noopener">map</a>` : "")],
      e.sides ? ["Sides", (typeof e.sides.rating === "number" ? `<strong>${fmtScore(e.sides.rating)}/10</strong>` : "") +
        ((e.sides.items || []).length ? `${typeof e.sides.rating === "number" ? " · " : ""}${esc(e.sides.items.map(sideName).join(", "))}` : "") +
        (e.sides.note ? `<br>${esc(e.sides.note)}` : "") + sidesDetail(e.sides)] : null,
      typeof e.ambiance === "number" ? ["Ambiance", `<strong>${fmtScore(e.ambiance)}/10</strong> <small>(not part of the food score)</small>`] : null,
      typeof e.priceThb === "number" ? ["Paid", priceHtml(e) + (e.priceNote ? ` <small>(${esc(e.priceNote)})</small>` : "")] : null,
      day ? ["Trip day", `Day ${dayIndex[e.date] + 1} · ${esc(day.location)}`] : null,
    ].filter(Boolean);
    dlg.innerHTML = `<button class="lb-close" type="button" aria-label="Close">${ICON.close}</button>
      <div class="lb${photos[0] ? "" : " nophoto"}" data-region="${esc(e.region)}">
        ${photos[0] ? `<div class="lb-photo"><img id="lbImg" src="${esc(photos[0].src)}" alt="${esc(photos[0].alt || e.dish)}"></div>` : ""}
        <div class="lb-body">
          <span class="region-tag" data-region="${esc(e.region)}">${esc(regionName(e.region))}</span>
          <h2 id="lbTitle">${esc(e.dish)}</h2>
          ${e.thaiName ? `<p class="thai" lang="th">${esc(e.thaiName)}</p>` : ""}
          ${typeof e.rating === "number" ? `<div>${ratingHtml(e.rating)} <span style="color:var(--ink-faint);font-size:var(--step--1);font-weight:600">main dish</span></div>` : ""}
          ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ""}
          ${breakdown(e)}
          ${canScore ? `<button type="button" class="score-btn" data-score="${esc(e.id)}">${e.scores?.main ? "Edit scores" : "Score it"}</button>` : ""}
          <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
          ${photos.length > 1 ? `<div class="lb-thumbs">${photos.map((p, i) => `<button type="button" data-i="${i}" aria-current="${i === 0}" aria-label="Photo ${i + 1}"><img src="${esc(p.src)}" alt=""></button>`).join("")}</div>` : ""}
        </div>
      </div>`;
    dlg.showModal();
  }
  dlg.addEventListener("click", ev => {
    if (ev.target === dlg || ev.target.closest(".lb-close")) dlg.close();
  });
  dlg.addEventListener("click", ev => {
    const t = ev.target.closest(".lb-thumbs button"); if (!t) return;
    const img = $("#lbImg"); const src = t.querySelector("img").getAttribute("src");
    if (img) img.src = src;
    dlg.querySelectorAll(".lb-thumbs button").forEach(b => b.setAttribute("aria-current", b === t));
  });

  /* ---------- Live scores (artifact db) ----------
     Scores entered on the page live in db collection "scores", one doc per entry id:
     { main: {flavour, value, texture, presentation}, sidesRating, sideItems: {name: n}, ambiance }.
     They override the repo data; Claude folds them back into data/entries.json. */
  let db = null, canScore = false, dbScores = {};
  const isScore = v => Number.isInteger(v) && v >= 1 && v <= 10;
  // Round half up to one decimal — must match dish_score() in scripts/build.py.
  const weighted = qs => Math.floor(Object.entries(RUBRIC).reduce((t, [k, w]) => t + qs[k] * w, 0) * 10 / Object.values(RUBRIC).reduce((a, b) => a + b, 0) + 0.5) / 10;
  function applyScores(e, sc) {
    const x = JSON.parse(JSON.stringify(e));
    if (sc.main && Object.keys(RUBRIC).every(k => isScore(sc.main[k]))) {
      const main = Object.fromEntries(Object.keys(RUBRIC).map(k => [k, sc.main[k]]));
      x.scores = { ...(x.scores || {}), main };
      x.rating = weighted(main);
    }
    if (isScore(sc.sidesRating)) x.sides = { items: [], ...(x.sides || {}), rating: sc.sidesRating };
    if (sc.sideItems && typeof sc.sideItems === "object" && x.sides?.items) {
      x.sides.items = x.sides.items.map(it => {
        const r = sc.sideItems[sideName(it)];
        if (!isScore(r)) return it;
        return typeof it === "string" ? { name: it, rating: r } : { ...it, rating: r };
      });
    }
    if (isScore(sc.ambiance)) x.ambiance = sc.ambiance;
    return x;
  }
  function refresh() {
    entries = BASE.map(e => dbScores[e.id] ? applyScores(e, dbScores[e.id]) : e);
    derive(); render();
  }

  const ANCHOR = "1–2 bad · 3–4 below par · 5–6 fine · 7–8 genuinely good · 9–10 among the best";
  function steps(e) {
    const st = [
      { key: "flavour", title: "Flavour", q: "Is it well seasoned and balanced? Does it taste good?" },
      { key: "value", title: "Value", q: "Was it worth what you paid?" },
      { key: "texture", title: "Texture", q: "How does it feel to eat: bite, crispness, tenderness?" },
      { key: "presentation", title: "Presentation", q: "Did it look good and arrive well put together?" },
    ];
    if (e.sides) st.push({ key: "sidesRating", title: "Sides", q: "One score for everything else on the table.", optional: true });
    if ((e.sides?.items || []).length) st.push({ key: "sideItems", title: "Standout sides", q: "Score any side worth calling out. Skip the rest.", optional: true, multi: true });
    st.push({ key: "ambiance", title: "Ambiance", q: "The setting. Shown separately; it never counts toward the food score.", optional: true });
    return st;
  }
  let wiz = null;
  function startScoring(id) {
    const e = entries.find(x => x.id === id); if (!e) return;
    const prev = dbScores[id] || {};
    const sideItems = {};
    (e.sides?.items || []).forEach(it => { if (typeof it === "object" && isScore(it.rating)) sideItems[it.name] = it.rating; });
    wiz = {
      e, i: 0, st: steps(e),
      v: {
        ...(e.scores?.main || {}), ...(prev.main || {}),
        sidesRating: prev.sidesRating ?? (e.scores?.main && isScore(e.sides?.rating) ? e.sides.rating : undefined),
        sideItems: { ...sideItems, ...(prev.sideItems || {}) },
        ambiance: prev.ambiance ?? e.ambiance,
      },
    };
    drawWizard();
  }
  const numRow = (name, cur) => `<div class="nums" role="radiogroup" aria-label="${esc(name)}">${Array.from({ length: 10 }, (_, k) => k + 1).map(n =>
    `<button type="button" role="radio" aria-checked="${cur === n}" data-n="${n}" data-for="${esc(name)}">${n}</button>`).join("")}</div>`;
  function drawWizard() {
    const { e, st, i, v } = wiz;
    const body = dlg.querySelector(".lb-body");
    const total = st.length + 1;
    let inner;
    if (i < st.length) {
      const s = st[i];
      const field = s.multi
        ? `<ul class="multi">${e.sides.items.map(it => { const n = sideName(it); return `<li><span>${esc(n)}</span>${numRow(n, v.sideItems[n])}</li>`; }).join("")}</ul>`
        : numRow(s.key, v[s.key]);
      inner = `<p class="wiz-step">${i + 1} of ${total} · ${esc(e.dish)}</p>
        <h2 id="lbTitle">${s.title}</h2><p class="wiz-q">${s.q}</p>${field}<p class="wiz-anchor">${ANCHOR}</p>
        <div class="wiz-nav"><button type="button" class="ghost" data-nav="back">${i ? "Back" : "Cancel"}</button>
        ${s.multi || s.optional ? `<button type="button" class="ghost" data-nav="next">${s.multi ? "Next" : "Skip"}</button>` : ""}</div>`;
    } else {
      const ok = Object.keys(RUBRIC).every(k => isScore(v[k]));
      inner = `<p class="wiz-step">${total} of ${total} · ${esc(e.dish)}</p><h2 id="lbTitle">Check and save</h2>
        ${ok ? `<div>${ratingHtml(weighted(v))} <span class="wiz-q">main dish</span></div>` : `<p class="wiz-q">Flavour, value, texture and presentation are all needed.</p>`}
        <dl class="facts">${Object.keys(RUBRIC).map(k => `<dt>${k[0].toUpperCase() + k.slice(1)} ×${RUBRIC[k]}</dt><dd>${v[k] ?? "–"}</dd>`).join("")}
        ${isScore(v.sidesRating) ? `<dt>Sides</dt><dd>${v.sidesRating}</dd>` : ""}
        ${Object.entries(v.sideItems).filter(([, r]) => isScore(r)).map(([n, r]) => `<dt>${esc(n)}</dt><dd>${r}</dd>`).join("")}
        ${isScore(v.ambiance) ? `<dt>Ambiance</dt><dd>${v.ambiance} <small>(not in the food score)</small></dd>` : ""}</dl>
        <p class="wiz-msg" role="status"></p>
        <div class="wiz-nav"><button type="button" class="ghost" data-nav="back">Back</button><button type="button" class="primary" data-nav="save" ${ok ? "" : "disabled"}>Save scores</button></div>`;
    }
    dlg.querySelector(".lb").classList.add("scoring");
    body.innerHTML = inner;
    body.querySelector(".nums button[aria-checked=true], .nums button, .primary")?.focus({ preventScroll: true });
  }
  async function saveScores() {
    const { e, v } = wiz;
    const btn = dlg.querySelector("[data-nav=save]"), msg = dlg.querySelector(".wiz-msg");
    btn.disabled = true; msg.textContent = "Saving…";
    const doc = { main: Object.fromEntries(Object.keys(RUBRIC).map(k => [k, v[k]])), updatedAt: new Date().toISOString() };
    if (isScore(v.sidesRating)) doc.sidesRating = v.sidesRating;
    const items = Object.fromEntries(Object.entries(v.sideItems).filter(([, r]) => isScore(r)));
    if (Object.keys(items).length) doc.sideItems = items;
    if (isScore(v.ambiance)) doc.ambiance = v.ambiance;
    try {
      await db.doc("scores/" + e.id).set(doc);
      dbScores[e.id] = doc; wiz = null; refresh(); open(e.id);
    } catch (err) {
      btn.disabled = false;
      msg.textContent = err?.code === "invalid_argument" ? "Only the journal's owner can save scores." : "Couldn't save just now. Try again in a moment.";
    }
  }
  dlg.addEventListener("click", ev => {
    if (!wiz) return;
    const n = ev.target.closest(".nums button");
    if (n) {
      const val = +n.dataset.n, f = n.dataset.for, s = wiz.st[wiz.i];
      if (s?.multi) { wiz.v.sideItems[f] = wiz.v.sideItems[f] === val ? undefined : val; drawWizard(); }
      else { wiz.v[f] = val; wiz.i++; drawWizard(); }
      return;
    }
    const nav = ev.target.closest("[data-nav]"); if (!nav) return;
    if (nav.dataset.nav === "back") { if (wiz.i === 0) { const id = wiz.e.id; wiz = null; open(id); } else { wiz.i--; drawWizard(); } }
    else if (nav.dataset.nav === "next") { wiz.i++; drawWizard(); }
    else if (nav.dataset.nav === "save") saveScores();
  });
  dlg.addEventListener("click", ev => { const b = ev.target.closest("[data-score]"); if (b) startScoring(b.dataset.score); });
  dlg.addEventListener("close", () => { wiz = null; });

  (async () => {
    if (!window.claude?.use) return;
    const [d, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d) return;
    db = d;
    const can = user ? await user.canEdit() : null;
    canScore = can !== false;
    const slow = setTimeout(() => { $("#liveNote").textContent = " · Live scores can't be reached right now."; }, 10000);
    db.collection("scores").onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(slow); $("#liveNote").textContent = ""; }
      dbScores = Object.fromEntries(snap.docs.filter(x => x.exists).map(x => [x.id, x.data()]));
      refresh();
    }, () => { clearTimeout(slow); });
    render();
  })();

  /* ---------- Events ---------- */
  const syncHash = () => { try { history.replaceState(null, "", `#r=${state.region}&s=${state.sort}`); } catch {} };
  $("#filters").addEventListener("click", ev => { const b = ev.target.closest("[data-filter]"); if (!b) return; state.region = b.dataset.filter; syncHash(); render(); });
  document.querySelector(".sort").addEventListener("click", ev => { const b = ev.target.closest("[data-sort]"); if (!b) return; state.sort = b.dataset.sort; syncHash(); render(); });
  $("#main").addEventListener("click", ev => { const c = ev.target.closest(".dish"); if (c) open(c.dataset.id); });

  $("#footer").innerHTML = `Kin Khao · ${esc(trip.name || "Thailand")} · prices in baht, dollars at ~${RATE} THB to $1 · <a href="brand.html">Brand kit</a><span id="liveNote"></span>`;
  derive();
  render();
})();
</script>
</body>
</html>
